# ============================================================
# Courier 配置文件
# 复制此文件为 config.toml 并填入你的实际值
# ============================================================

[general]
# 日志级别: trace, debug, info, warn, error
log_level = "info"
# 数据存储路径
data_dir = "./data"
# Dashboard API 端口
api_port = 3001
# Dashboard API 密钥 (可选, 设置后所有 API 请求需携带 Bearer Token)
# api_key = "your-secret-api-key"
# 调度器时区 (影响 cron 表达式的时间解析)
# 默认为 "UTC"，中国用户建议设为 "Asia/Shanghai"
timezone = "Asia/Shanghai"

# ============================================================
# 数据源配置
# ============================================================

[sources.hackernews]
enabled = true
# 抓取 top stories 数量
top_n = 20

[sources.reddit]
enabled = false
# 要订阅的 subreddit 列表
subreddits = ["programming", "rust", "technology"]
# 每个 subreddit 抓取帖子数
top_n = 10

[sources.rss]
enabled = false
# RSS feed 列表
# 可直接使用 RSSHub 生成的 feed URL（docker-compose 部署时用 http://rsshub:1200）
feeds = [
    # { name = "Rust Blog", url = "https://blog.rust-lang.org/feed.xml" },
    # --- RSSHub 示例 (需部署 RSSHub, 参见 docker-compose.yml) ---
    # { name = "Hacker News", url = "http://rsshub:1200/hackernews" },
    # { name = "GitHub Trending", url = "http://rsshub:1200/github/trending/daily/any/en" },
    # { name = "Reddit ML", url = "http://rsshub:1200/reddit/subreddit/MachineLearning" },
    # { name = "Product Hunt", url = "http://rsshub:1200/producthunt/today" },
    # { name = "V2EX Hot", url = "http://rsshub:1200/v2ex/topics/hot" },
    # { name = "36kr News", url = "http://rsshub:1200/36kr/news/latest" },
    # 更多路由: https://docs.rsshub.app/zh/routes/
]

# ============================================================
# LLM 配置
# ============================================================

[llm]
# OpenAI 兼容 API
api_base = "https://api.openai.com/v1"
api_key = "sk-your-api-key"
model = "gpt-4o-mini"
# 摘要最大 token 数（建议 4000-8000，过小会导致输出截断）
max_tokens = 4000
# 自定义系统提示词 (可选)
# system_prompt = ""

# ============================================================
# 推送通道配置
# ============================================================

[channels.telegram]
enabled = true
# Bot Token (从 @BotFather 获取)
bot_token = "your-telegram-bot-token"
# 推送目标 Chat ID (个人/群组)
chat_ids = []
# 是否启用聊天模式
chat_mode = true

[channels.feishu]
enabled = false
# 飞书 Bot Webhook URL
webhook_url = "https://open.feishu.cn/open-apis/bot/v2/hook/your-hook-id"
# 飞书应用凭证 (用于聊天模式, 可选)
# app_id = ""
# app_secret = ""

[channels.email]
enabled = false
# SMTP 配置
smtp_host = "smtp.gmail.com"
smtp_port = 465
smtp_username = "your-email@gmail.com"
smtp_password = "your-app-password"
# 发件人
from = "Courier Bot <your-email@gmail.com>"
# 收件人列表
to = ["recipient@example.com"]

# ============================================================
# 定时任务配置
# ============================================================

[[schedules]]
name = "每日科技日报"
# Cron 表达式: 每天早上 9:00 (按 timezone 配置的时区解析)
cron = "0 0 9 * * *"
# 数据源
sources = ["hackernews"]
# 推送通道
channels = ["telegram"]
# 启动时立即执行一次
run_on_start = false
# LLM 调用最大重试次数
max_retries = 2
# 摘要模板 (可选)
# prompt_template = ""

# 支持多个定时任务，使用不同数据源/通道/时间
# [[schedules]]
# name = "每日 Reddit AI 精选"
# cron = "0 0 18 * * *"
# sources = ["reddit"]
# channels = ["feishu"]
# max_retries = 2
