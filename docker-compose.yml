version: '3.8'

services:
  courier:
    image: courier:latest
    container_name: courier
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - courier_data:/app/data
    environment:
      - TZ=Asia/Shanghai

volumes:
  courier_data:
