[package]
name = "courier"
version = "0.1.0"
edition = "2021"
description = "A lightweight personal news digest bot — fetch, summarize, and push"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "native-tls", "gzip", "cookies"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Telegram bot
teloxide = { version = "0.13", features = ["macros"] }

# Email
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }

# LLM
async-openai = "0.27"

# Scheduling
tokio-cron-scheduler = "0.13"
uuid = "1"

# Content parsing
scraper = "0.22"
rss = "2"
atom_syndication = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"
thiserror = "2"

# HTTP server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
async-trait = "0.1"
url = { version = "2", features = ["serde"] }

# Database
rusqlite = { version = "0.35", features = ["bundled"] }
